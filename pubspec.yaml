name: agremate_admin
description: "Agremate Super Admin Dashboard - Property Management Platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.2
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1
  intl: ^0.20.2
  dio: ^5.9.2
  dartz: ^0.10.1
  internet_connection_checker: ^3.0.1
  url_launcher: ^6.3.0
  logger: ^2.8.0
  file_picker: ^13.1.0

  google_maps_flutter_web: ^0.6.4+1
  google_maps_flutter: ^2.18.1
  geolocator: ^14.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-VariableFont_wght.ttf
        - asset: assets/fonts/Montserrat-Italic-VariableFont_wght.ttf
          style: italic


